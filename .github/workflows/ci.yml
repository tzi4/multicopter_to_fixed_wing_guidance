name: offline-validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.8"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install verified Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-lock.txt

      - name: Public-release and syntax checks
        run: |
          python tools/public_release_check.py
          python -m compileall -q bbox_to_redis.py donanim guidance_allstar tools yarışma
          bash -n yildizlar_gudum.sh tools/senaryo.sh

      - name: Guidance tests
        run: |
          python donanim/test_balon_menzil.py
          cd guidance_allstar
          python terminal_los_test.py
          python mpc_test.py
          python los_test.py
          python pid_test.py
