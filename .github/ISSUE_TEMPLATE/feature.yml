name: Feature proposal
description: Propose a scoped research or engineering improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Which measured limitation or use case does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe interfaces, safety effects and expected trade-offs.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Explain how the proposal will be falsified or measured.
    validations:
      required: true
