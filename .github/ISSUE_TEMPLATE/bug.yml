name: Bug report
description: Report a reproducible software or simulation defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, real GPS coordinates or private flight data.
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Offline/unit test
        - SITL/Gazebo
        - Propeller-free bench
        - Real flight
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal commands, configuration and sanitized logs.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      placeholder: git rev-parse --short HEAD
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data check
      options:
        - label: I removed credentials, GPS coordinates, faces and private telemetry.
          required: true
